models:
  mock_guard:
    enabled: true
    mode: "perfect"
    description: "Lightweight CPU mock guard for local pipeline testing."

  rule_baseline:
    enabled: true
    description: "Deterministic state-based rule baseline checking moodle_state."

  qwen_guard:
    enabled: true
    checkpoint: "Qwen/Qwen2.5-1.5B-Instruct"
    load_in_4bit: false
    description: "Qwen2.5 / Qwen3 open-source safety guard model (free HF)."

  llama_guard:
    enabled: true
    checkpoint: "meta-llama/Llama-Guard-3-1B"
    load_in_4bit: false
    description: "Llama Guard 3 open-source safety model (free HF)."

  webguard:
    enabled: true
    checkpoint: "OSU-NLP/WebGuard-7B"
    load_in_4bit: true
    description: "WebGuard 7B action consequence classifier model (free HF)."

  dynaguard:
    enabled: true
    checkpoint: "DynaGuard/DynaGuard-8B"
    load_in_4bit: true
    description: "DynaGuard 8B policy-following guard model (free HF)."

  policyguard:
    enabled: true
    checkpoint: "PolicyGuard/PolicyGuard-4B"
    load_in_4bit: false
    description: "PolicyGuard 4B open-source policy compliance model (free HF)."

  large_model_judge:
    enabled: false
    description: "Disabled (Free open-source SLMs only)."
