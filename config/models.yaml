models:
  mock_guard:
    enabled: true
    mode: "perfect"
    description: "Lightweight CPU mock guard for local pipeline testing."

  policyguard:
    enabled: true
    checkpoint: "Rakancorle1/PolicyGuard-4B"
    load_in_4bit: false
    limit: 24
    description: "PolicyGuard-4B Web Agent Trajectory Guardrail (Native trajectory format -> violation / no_violation)."

  dynaguard:
    enabled: true
    checkpoint: "tomg-group-umd/DynaGuard-1.7B"
    load_in_4bit: false
    limit: 24
    description: "DynaGuard-1.7B Dynamic Policy Compliance Guardrail (Native gatekeeper format -> PASS/ALLOW or FAIL/BLOCK)."

  webguard:
    enabled: true
    checkpoint: "Qwen/Qwen2.5-3B-Instruct"
    adapter_path: "models/webguard_qwen_lora"
    load_in_4bit: false
    augmented: true
    limit: 24
    description: "WebGuard-3B Accessibility Tree Action Guardrail (Native a11y tree risk format -> SAFE / LOW / HIGH)."

  qwen3_vl_2b:
    enabled: true
    checkpoint: "Qwen/Qwen3-VL-2B-Instruct"
    is_vlm: true
    load_in_4bit: false
    description: "Qwen3-VL 2B Multimodal Vision-Language Model. Supports BOTH Strategy A (Text-only) and Strategy B (Text + Screenshot)."

  large_model_judge:
    enabled: false
    description: "Disabled (Free open-source SLMs only)."
